  <head>

    <link rel="stylesheet" href="css/styles.css?v=20260903-footer3">
  </head>
  <body>
    <header class="site-header" aria-label="Primary navigation">
      <a class="brand" href="index.html" aria-label="Home">
        <span class="brand-mark home-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M3 10.8 12 3l9 7.8V21a1 1 0 0 1-1 1h-5.5v-6.8h-5V22H4a1 1 0 0 1-1-1V10.8Z"></path>
          </svg>
        </span>
      </a>
      <nav class="nav-links" aria-label="Main menu">
        <a href="index.html#work">Work</a>
        <a href="index.html#network">Network</a>
        <a href="trace.html">Trace</a>
      </nav>
    </header>

    <aside class="social-dock" aria-label="Social links">
      <a href="https://www.instagram.com/" aria-label="Instagram">
        <span aria-hidden="true">IG</span>
      </a>
      <a href="https://www.youtube.com/" aria-label="YouTube">
        <span class="play-icon" aria-hidden="true"></span>
      </a>
      <a href="https://www.linkedin.com/" aria-label="LinkedIn">
        <span aria-hidden="true">in</span>
      </a>
    </aside>

    <main class="person-page">
      <section class="person-hero">
        <a class="back-link" href="index.html#network">Back to network</a>
        <p class="profile-section-kicker">Network Profile</p>
        <h1 id="personName">Selected Name</h1>
        <p id="personSummary"></p>

      <section class="person-layout">
        <div class="person-work-preview" aria-label="Related works placeholder">
          <span id="personSlug">selected-name</span>
        </div>
        <article class="project-copy">
          <h2>Related Works</h2>
          <p id="personNote"></p>
          <dl class="project-meta">
            <div>
              <dt>Page Type</dt>
              <dd>Person / Works</dd>
            </div>
            <div>
              <dt>Status</dt>
              <dd>Placeholder</dd>
            </div>
          </dl>
        </article>
      </section>
    </main>

    <script src="js/site-footer.20260903-v1.js?v=20260903-footer4"></script>
